name: Shell Command #workflow id
on: workflow_dispatch #event trigger
jobs: #task 단위
  run: #job id 사용자 단위로 작성 가능
    runs-on: ubuntu-latest #실행환경
    steps: #실행최소단위
      - name: Check environment #step1의 id
        run: #여러 shell command 실행
            echo "Current directory:" 
            pwd
            echo "File list:"
            ls -la
      - name: Check file
        run: 
          if [ -f "README.md"  ]; then
            echo "File exists"
          else
           echo "File not found"
          fi
      - name: Pepeat commands
        run:
          for i in 1 2 3
          do
            echo "TEst $i"
          done
      - name: Use environment variable
        env:
            MESSAGE: Hello
        run: echo "$MESSAGE"


